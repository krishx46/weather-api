[project]
name = "weather-api"
version = "0.1.0"
description = "Async weather and flight advisory CLI, built with strict deterministic guardrails for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "hypothesis",
    "import-linter",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Expected layout: src/weather_api/{__init__,models,client,adviser}.py
[tool.setuptools.packages.find]
where = ["src"]

# ==============================================================================
# Ruff (linting, formatting, anti-pattern elimination)
# ==============================================================================
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print (no print in production code)
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "RUF",    # Ruff-specific rules (includes RUF100: unused noqa)
    "PGH",    # pygrep-hooks (blocks blanket `# noqa` and `# type: ignore`)
    "TID",    # flake8-tidy-imports (import discipline)
    "S",      # flake8-bandit (security)
    "ASYNC",  # flake8-async (async mistakes)
    "BLE",    # flake8-blind-except
    "PT",     # flake8-pytest-style
    "DTZ",    # flake8-datetimez (naive datetimes)
]
ignore = [
    "E501",   # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]            # the verification CLI must print
"tests/*" = ["S101", "ARG"]       # assert is fine in tests; fixtures may have unused args

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["weather_api"]

# ==============================================================================
# Mypy (strict static typing)
# ==============================================================================
[tool.mypy]
python_version = "3.10"
strict = true                     # already implies most strict flags
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
pretty = true
show_column_numbers = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ==============================================================================
# Pytest (testing infrastructure)
# ==============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 10                      # a hung test fails instead of freezing

# ==============================================================================
# Import Linter (architecture boundaries, run with `lint-imports`)
# ==============================================================================
[tool.importlinter]
root_package = "weather_api"

[[tool.importlinter.contracts]]
name = "Decision logic must not depend on the network client"
type = "forbidden"
source_modules = ["weather_api.adviser"]
forbidden_modules = ["weather_api.client"]

[[tool.importlinter.contracts]]
name = "Models are a leaf layer"
type = "forbidden"
source_modules = ["weather_api.models"]
forbidden_modules = ["weather_api.client", "weather_api.adviser"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
containers = ["weather_api"]
layers = [
    "service",
    "client | adviser",
    "models",
]
